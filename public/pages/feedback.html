<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback - LCPGameStats</title>
  <link href="/node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header py-4 mb-4">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 app-nav-row mb-3">
        <nav class="app-nav" aria-label="Site">
          <a href="/" id="nav-home" class="app-nav-link" title="Home">
            <i class="fa-solid fa-house"></i>
            <span class="app-nav-link__label" id="nav-home-label">Home</span>
          </a>
          <a href="/feedback" id="nav-feedback" class="app-nav-link active" title="Feedback">
            <i class="fa-solid fa-comment-dots"></i>
            <span class="app-nav-link__label" id="nav-feedback-label">Feedback</span>
          </a>
          <a href="/about" id="nav-about" class="app-nav-link" title="About">
            <i class="fa-solid fa-circle-info"></i>
            <span class="app-nav-link__label" id="nav-about-label">About</span>
          </a>
          <a href="/admin" id="btn-admin" class="app-nav-link d-none" title="Admin">
            <i class="fa-solid fa-user-shield"></i>
            <span class="app-nav-link__label" id="nav-admin-label">Admin</span>
          </a>
        </nav>
        <div id="app-clock" class="app-clock" aria-live="off">
          <i class="fa-regular fa-clock app-clock__icon"></i>
          <span id="app-clock-time" class="app-clock__time">00:00:00</span>
          <span id="app-clock-date" class="app-clock__date">--</span>
        </div>
      </div>
      <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
        <div>
          <h1 class="h3 mb-1 fw-bold" id="feedback-title">Send Feedback</h1>
          <p class="mb-0 text-muted small" id="feedback-subtitle">We'd love to hear your thoughts, bug reports, or feature ideas.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="dropdown lang-dropdown">
            <button id="lang-select-btn" class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Language" aria-label="Language">
              <img id="lang-select-flag" class="lang-flag" src="/node_modules/country-flag-icons/3x2/US.svg" alt="" />
              <span id="lang-select-label" class="lang-select-label">English</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="lang-select-btn">
              <li><button type="button" class="dropdown-item d-flex align-items-center gap-2 active" data-lang="en" data-flag="US"><img class="lang-flag" src="/node_modules/country-flag-icons/3x2/US.svg" alt="" /> English</button></li>
              <li><button type="button" class="dropdown-item d-flex align-items-center gap-2" data-lang="es" data-flag="ES"><img class="lang-flag" src="/node_modules/country-flag-icons/3x2/ES.svg" alt="" /> Español</button></li>
              <li><button type="button" class="dropdown-item d-flex align-items-center gap-2" data-lang="de" data-flag="DE"><img class="lang-flag" src="/node_modules/country-flag-icons/3x2/DE.svg" alt="" /> Deutsch</button></li>
              <li><button type="button" class="dropdown-item d-flex align-items-center gap-2" data-lang="pt" data-flag="PT"><img class="lang-flag" src="/node_modules/country-flag-icons/3x2/PT.svg" alt="" /> Português</button></li>
              <li><button type="button" class="dropdown-item d-flex align-items-center gap-2" data-lang="fr" data-flag="FR"><img class="lang-flag" src="/node_modules/country-flag-icons/3x2/FR.svg" alt="" /> Français</button></li>
            </ul>
          </div>
          <button id="lang-name-toggle" type="button" class="btn btn-outline-secondary btn-sm lang-name-toggle" title="Hide language name" aria-label="Hide language name" aria-pressed="false">
            <i class="fa-regular fa-eye"></i>
          </button>
          <a href="/" class="btn btn-sm btn-outline-secondary" id="back-to-library">Back to library</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <div id="feedback-status" class="alert d-none py-2 small" role="status"></div>

    <div class="card border-primary-subtle">
      <div class="card-body">
        <form id="feedback-form">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label" for="feedback-name" id="feedback-name-label">Name</label>
              <input id="feedback-name" class="form-control" required />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label" for="feedback-email" id="feedback-email-label">Email</label>
              <input id="feedback-email" type="email" class="form-control" required />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label" for="feedback-category" id="feedback-category-label">Category</label>
              <select id="feedback-category" class="form-select">
                <option value="bug" id="feedback-category-bug">Bug report</option>
                <option value="feature" id="feedback-category-feature">Feature request</option>
                <option value="general" selected id="feedback-category-general">General feedback</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label d-block" id="feedback-rating-label">Overall rating</label>
              <div class="feedback-rating" id="feedback-rating">
                <input type="radio" name="rating" id="rating-5" value="5" /><label for="rating-5" title="5"><i class="fa-solid fa-star"></i></label>
                <input type="radio" name="rating" id="rating-4" value="4" /><label for="rating-4" title="4"><i class="fa-solid fa-star"></i></label>
                <input type="radio" name="rating" id="rating-3" value="3" checked /><label for="rating-3" title="3"><i class="fa-solid fa-star"></i></label>
                <input type="radio" name="rating" id="rating-2" value="2" /><label for="rating-2" title="2"><i class="fa-solid fa-star"></i></label>
                <input type="radio" name="rating" id="rating-1" value="1" /><label for="rating-1" title="1"><i class="fa-solid fa-star"></i></label>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="feedback-message" id="feedback-message-label">Message</label>
              <textarea id="feedback-message" class="form-control" rows="5" placeholder="Tell us what's on your mind..." required></textarea>
            </div>
          </div>
          <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-primary" id="feedback-submit-btn">Send Feedback</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="app-footer text-center text-muted py-4 small">
    <p class="mb-0" id="footer-text">Powered by the LCP - Created by Luis Carvalho - @2026</p>
  </footer>

  <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/node_modules/@fortawesome/fontawesome-free/js/all.min.js"></script>
  <script type="module" src="/js/feedback.js"></script>
</body>
</html>
